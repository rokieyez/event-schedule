<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>이동 중...</title>
<link rel="canonical" href="https://www.suayona.com/event/">
<style>
  body{font-family:system-ui,'Apple SD Gothic Neo',sans-serif; background:#fffaf2; color:#3a3226;
    display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; padding:24px; text-align:center;}
  a{color:#2f6f5e; font-weight:700;}
  p{font-size:14px; line-height:1.8;}
</style>
</head>
<body>
<div>
  <p>이벤트 페이지가 <b>www.suayona.com</b> 으로 옮겨졌어요.<br>잠시 후 자동으로 이동합니다.</p>
  <p><a id="go" href="https://www.suayona.com/event/">지금 바로 이동하기 →</a></p>
</div>
<script>
  // 주소 뒷부분(?slug=... 등)을 그대로 유지한 채 새 위치로 보냄
  var target = 'https://www.suayona.com/event' + location.pathname + location.search + location.hash;
  document.getElementById('go').href = target;
  location.replace(target);
</script>
</body>
</html>
