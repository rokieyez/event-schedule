<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이벤트 목록</title>
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="이벤트 목록">
<meta property="og:description" content="지금까지의 이벤트를 확인하세요.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://event.rokiz.net/">

<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
  :root{ --accent:#4f6df5; }
  *, *::before, *::after{box-sizing:border-box;}
  body{font-family:'Pretendard',sans-serif; margin:0; padding:40px 16px 60px; min-height:100vh;
    background:linear-gradient(180deg,#f4f7ff,#fff);}
  .wrap{max-width:640px; margin:0 auto;}

  h1{text-align:center; font-size:22px; font-weight:800; margin:0 0 6px;}
  .lead{text-align:center; color:#777; font-size:13.5px; margin:0 0 32px;}

  h2{font-size:13px; font-weight:800; color:#888; margin:28px 4px 10px; letter-spacing:.3px;}

  .card{display:block; padding:16px 18px; margin-bottom:10px; border-radius:14px; background:#fff;
    border:1px solid rgba(0,0,0,.06); text-decoration:none; color:inherit;
    transition:transform .15s, box-shadow .15s;}
  .card:hover{transform:translateY(-2px); box-shadow:0 6px 18px rgba(79,109,245,.15);}
  .card-top{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:4px;}
  .card-name{font-size:15.5px; font-weight:800;}
  .badge{font-size:11px; font-weight:800; padding:3px 9px; border-radius:20px; flex-shrink:0;}
  .badge.ongoing{background:#e8edff; color:var(--accent);}
  .badge.upcoming{background:#f1f1f1; color:#888;}
  .badge.done{background:#f1f1f1; color:#aaa;}
  .card-sub{font-size:12.5px; color:#888;}

  .past .card{opacity:.6;}
  .past .card:hover{opacity:1;}

  .empty{text-align:center; color:#aaa; font-size:13px; padding:30px 0;}

  /* ----- 로그인 ----- */
  #login-box{max-width:340px; margin:0 auto; background:#fff; border-radius:14px; padding:22px; border:1px solid rgba(0,0,0,.06);}
  #login-box label{display:block; font-size:12.5px; font-weight:700; color:#666; margin:12px 0 6px;}
  #login-box label:first-of-type{margin-top:0;}
  input{width:100%; padding:10px 12px; border:1px solid #ddd; border-radius:8px; font-size:14px; font-family:inherit;}
  .btn{width:100%; margin-top:14px; padding:10px 16px; border:none; border-radius:8px; font-size:13.5px;
    font-weight:700; background:var(--accent); color:#fff; cursor:pointer; font-family:inherit;}
  .btn:hover{opacity:.9;}
  #login-msg{font-size:12.5px; color:#e0503f; margin-top:10px; min-height:1em; text-align:center;}

  #content{display:none;}
  #logoutRow{text-align:center; margin-bottom:20px;}
  #logoutRow button{background:none; border:none; color:#999; font-size:12.5px; cursor:pointer; font-family:inherit;}
  #logoutRow button:hover{color:var(--accent);}
</style>
</head>
<body>
<div class="wrap">
  <h1>🗓️ 이벤트 목록</h1>
  <p class="lead">관리자 로그인 후 지금까지 열린 이벤트를 확인할 수 있어요</p>

  <div id="login-box">
    <label>이메일</label>
    <input type="email" id="loginEmail" autocomplete="username">
    <label>비밀번호</label>
    <input type="password" id="loginPw" autocomplete="current-password">
    <button class="btn" id="loginBtn">로그인</button>
    <div id="login-msg"></div>
  </div>

  <div id="content">
    <div id="logoutRow"><button id="logoutBtn">로그아웃</button></div>

    <div id="current-section">
      <h2>진행중 · 예정</h2>
      <div id="current-list"></div>
    </div>

    <div id="past-section" class="past">
      <h2>지난 이벤트</h2>
      <div id="past-list"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL = 'https://ifiemaypzjwdrljmmkgb.supabase.co';
const SB_KEY = 'sb_publishable_uhn46d4RFI5DeIUjtz3IRA_U9X8iPZj';
const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = s => document.querySelector(s);

/* =========================================================================
   이벤트가 새로 생기면 이 배열에 한 줄씩 추가하세요.
   slug: 폴더 이름 (예: 2026-08-sua -> event.rokiz.net/2026-08-sua/)
   startDate / endDate: [년, 월-1, 일]
   ========================================================================= */
const EVENTS = [
  {
    slug: '2026-08-sua',
    orgName: '수아연아랑',
    eventName: '일정명',
    dateRangeText: '2026. 8. 14(금) ~ 8. 17(월)',
    startDate: [2026, 7, 14],
    endDate:   [2026, 7, 17],
  },
];
/* ========================================================================= */

function getStatus(ev){
  const now = new Date();
  const start = new Date(...ev.startDate);
  const end = new Date(ev.endDate[0], ev.endDate[1], ev.endDate[2], 23, 59, 59);
  if (now < start) return 'upcoming';
  if (now <= end) return 'ongoing';
  return 'done';
}

function cardHTML(ev, status){
  const badgeText = status === 'ongoing' ? '진행중' : status === 'upcoming' ? '예정' : '종료';
  return '<a class="card" href="/' + ev.slug + '/">' +
    '<div class="card-top"><span class="card-name">' + ev.orgName + ' · ' + ev.eventName + '</span>' +
    '<span class="badge ' + status + '">' + badgeText + '</span></div>' +
    '<div class="card-sub">' + ev.dateRangeText + '</div></a>';
}

function renderEvents(){
  const currentList = $('#current-list');
  const pastList = $('#past-list');
  const current = [], past = [];

  EVENTS.forEach(ev => {
    const status = getStatus(ev);
    (status === 'done' ? past : current).push({ev, status});
  });

  current.sort((a,b) => new Date(...a.ev.startDate) - new Date(...b.ev.startDate));
  past.sort((a,b) => new Date(...b.ev.endDate) - new Date(...a.ev.endDate));

  currentList.innerHTML = current.length ? current.map(c => cardHTML(c.ev, c.status)).join('') : '<div class="empty">진행중이거나 예정된 이벤트가 없습니다</div>';
  $('#past-section').style.display = past.length ? 'block' : 'none';
  pastList.innerHTML = past.map(c => cardHTML(c.ev, c.status)).join('');
}

// ----- 로그인 상태에 따라 화면 전환 -----
async function refreshAuthUI(){
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    $('#login-box').style.display = 'none';
    $('#content').style.display = 'block';
    renderEvents();
  } else {
    $('#login-box').style.display = 'block';
    $('#content').style.display = 'none';
  }
}

$('#loginBtn').addEventListener('click', async () => {
  const email = $('#loginEmail').value.trim();
  const password = $('#loginPw').value;
  $('#login-msg').textContent = '로그인 중...';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { $('#login-msg').textContent = '로그인 실패: ' + error.message; return; }
  $('#login-msg').textContent = '';
  refreshAuthUI();
});

$('#logoutBtn').addEventListener('click', async () => {
  await sb.auth.signOut();
  refreshAuthUI();
});

refreshAuthUI();
</script>
</body>
</html>
